name: Post next HayatTime video

on:
  schedule:
    # 11:47, 16:47, 20:47 (UTC = UK time in winter; one hour later in UK summer time)
    - cron: '47 11,16,20 * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'Post immediately, even if something posted in the last 50 minutes'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hayattime-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Post the next video
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python3 post.py ${{ github.event.inputs.now == 'true' && '--now' || '' }}

      - name: Save queue progress
        if: always()
        run: |
          git config user.name "hayattime-bot"
          git config user.email "hayattime-bot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "Posted: update queue"
          git push || (git pull --rebase && git push)
